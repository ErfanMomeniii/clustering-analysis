repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3.11
  # Keep the executed .ipynb and the re-runnable .py script in lockstep: the
  # .ipynb is the DVC dependency, so silent drift would make the pipeline
  # reproduce something other than the committed script.
  - repo: https://github.com/mwouts/jupytext
    rev: v1.16.4
    hooks:
      - id: jupytext
        args: [--sync, --pipe, black]
        additional_dependencies: [black==24.8.0]
