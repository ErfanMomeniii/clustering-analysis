seeds:
  global: 42
  ingest: 42
  scaling: 43
  reduce: 44
  tendency: 45
  algorithms: 46

ingest:
  source: "kaggle://mlg-ulb/creditcardfraud/creditcard.csv"
  expected_rows: 284807
  expected_columns: 31
  checksum_sha256: "76274b691b16a6c49d3f159c883398e03ccd6d1ee12d9d8ee38f4b4b98551a89"

clean:
  drop_duplicates: true

features:
  amount_transform: log1p
  time_period_seconds: 86400  # 24h cyclic encoding

scaling:
  strategy: hybrid  # one of: standard, robust, hybrid
  v_features: ["V1","V2","V3","V4","V5","V6","V7","V8","V9","V10","V11","V12","V13","V14","V15","V16","V17","V18","V19","V20","V21","V22","V23","V24","V25","V26","V27","V28"]
  robust_features: ["log_amount", "time_sin", "time_cos"]

reduce:
  pca_variance: 0.95
  umap:
    n_neighbors: 30
    min_dist: 0.05
    n_components_viz: 2
    metric: euclidean

tendency:
  hopkins:
    sample_fraction: 0.1
    n_repeats: 5
    pass_threshold: 0.6
  vat:
    n_legitimate: 2000
    n_fraud: 492

algorithms:
  k_range: [2, 3, 4, 5, 6, 7, 8, 10, 12, 15]   # candidate k for partitioning / hierarchical / GMM
  families:
    kmeans:
      n_init: 20
    ward:
      linkage: ward
    gmm:
      covariance_type: full   # one of: full, tied, diag, spherical
    hdbscan:
      min_cluster_size: 100
      min_samples: 10
      cluster_selection_method: eom

k_selection:
  silhouette:
    sample_size: 5000          # subsample for silhouette to keep runtime feasible
  gap:
    n_refs: 10                 # reference datasets per k
    seed_offset: 1000
  bootstrap:
    n_resamples: 20            # bootstrap stability resamples
    sample_fraction: 0.8

metrics:
  internal: [silhouette, davies_bouldin, calinski_harabasz, dunn]
  external: [ari, nmi, ami, v_measure, purity]

stability:
  n_seeds: 20
  seed_offset: 7000
  consensus:
    co_occurrence_threshold: 0.5   # link probability for consensus graph

phase2:
  input_matrix: X_pca              # one of: X_scaled, X_pca — clustering feature space
  # K-Means / GMM / HDBSCAN scale to all 283,726 rows. Ward does not: a full
  # pairwise distance matrix is 283,726² * 8 B ~ 322 GB. Group B therefore runs
  # on a stratified subsample, and the two regimes are reported side by side
  # rather than silently mixed into one table.
  full_algorithms: [kmeans, gmm, hdbscan]
  portfolio_n: 20000               # stratified rows where all four families are feasible
  k_selection_n: 20000             # rows for the k-selection sweep
  ablation_n: 5000                 # rows for the distance-metric ablation
  consensus_n: 2000                # rows for the co-association matrix
  error_analysis:
    n_worst: 200                   # lowest-silhouette points to characterise
    sample_size: 20000             # subsample for per-point silhouette
  primary_metric: silhouette       # metric that decides the preferred clustering

phase3:
  input_matrix: X_scaled           # deep models learn their own representation
  train_n: 40000                   # rows for autoencoder / DEC training
  eval_n: 40000                    # rows scored for the track comparison
  downstream:
    test_fraction: 0.3             # holdout for cluster-conditional modelling
  sensitivity:
    alt_scaler: standard           # preprocessing variant for the ARI-drift audit
  drift:
    n_bins: 10                     # quantile bins for PSI
    psi_threshold: 0.2             # documented re-fit trigger
    split_fraction: 0.5            # early/late split of the Time axis

deep:
  autoencoder:
    latent_dim: 10
    hidden_dims: [64, 32]
    epochs: 100
    batch_size: 256
    lr: 0.001
  ae_kmeans:
    epochs: 50                     # fine-tune epochs for AE+K-Means joint stage
  dec:
    init_epochs: 100               # pre-train AE before DEC init
    dec_epochs: 150                # DEC fine-tune epochs
    update_interval: 5             # recompute target distribution every N epochs
    tol: 0.001                     # convergence: delta label proportion
    gamma: 1.0                     # KL weight on DEC loss
  dec_infonce:
    contrastive_weight: 0.1        # lambda for InfoNCE auxiliary loss
    temperature: 0.5               # InfoNCE softmax temperature
    n_negatives: 1024              # negative samples per anchor

interpretation:
  tree_max_depth: 4                # decision-tree surrogate depth for rule extraction
  tree_min_samples_leaf: 50
  shap_background: 200             # k-means background samples for SHAP explainer
  dice_features: ["V14", "V4", "V12", "V10", "Amount"]  # mutable features for counterfactuals

significance:
  n_bootstrap: 1000                # bootstrap resamples for CIs
  ci_level: 0.95                   # confidence interval level
  n_permutations: 1000             # permutations for significance tests
  permutation_seed: 9001

dashboard:
  port: 8501
  sample_size: 10000               # subsample for UMAP scatter in dashboard
