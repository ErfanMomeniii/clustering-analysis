      size: 3468
    - path: src/clustering_analysis/schemas.py
      hash: md5
      md5: fba7190231cc9d75e5db86f26f22c4d2
      size: 1140
    params:
      params.yaml:
        ingest:
          source: kaggle://mlg-ulb/creditcardfraud/creditcard.csv
          expected_rows: 284807
          expected_columns: 31
          checksum_sha256: 
            76274b691b16a6c49d3f159c883398e03ccd6d1ee12d9d8ee38f4b4b98551a89
    outs:
    - path: data/raw/creditcard.parquet
      hash: md5
      md5: 4535b75b5f542649c5e7242ee25d7f16
      size: 72483046
    - path: data/raw/manifest.json
      hash: md5
      md5: cfe585ccf680e49d243210d383cb8de3
      size: 336
  clean_features:
    cmd: python -c " from pathlib import Path; import pandas as pd; from 
      clustering_analysis.config import load_params; from 
      clustering_analysis.clean import clean_frame, write_decision_log; from 
      clustering_analysis.features import engineer_features; from 
      clustering_analysis.io_utils import raw_path, interim_path, write_parquet;
      P = load_params(); df = pd.read_parquet(raw_path('creditcard.parquet')); 
      cleaned, stats = clean_frame(df, drop_duplicates=P.clean.drop_duplicates);
      write_parquet(cleaned, interim_path('cleaned.parquet')); 
      write_decision_log(stats, Path('reports/decision_log.md')); feat = 
      engineer_features(cleaned.drop(columns=['Class']), 
      period_seconds=P.features.time_period_seconds); write_parquet(feat, 
      interim_path('features.parquet')); 
      write_parquet(pd.Series(cleaned['Class'].values).to_frame('Class'), 
      interim_path('labels.parquet')); "
    deps:
    - path: data/raw/creditcard.parquet
      hash: md5
      md5: 4535b75b5f542649c5e7242ee25d7f16
      size: 72483046
    - path: src/clustering_analysis/clean.py
