schema: '2.0'
stages:
  ingest:
    cmd: python -c " from pathlib import Path; from clustering_analysis.config 
      import load_params; from clustering_analysis.ingest import ingest_csv; P =
      load_params(); ingest_csv(Path('data/raw/creditcard.csv'), 
      source=P.ingest.source, expected_rows=P.ingest.expected_rows, 
      expected_columns=P.ingest.expected_columns, 
      checksum_sha256=P.ingest.checksum_sha256)"
    deps:
    - path: data/raw/creditcard.csv
      hash: md5
      md5: e90efcb83d69faf99fcab8b0255024de
      size: 150828752
    - path: src/clustering_analysis/ingest.py
