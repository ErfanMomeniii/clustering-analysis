stages:
  ingest:
    cmd: >-
      python -c "from pathlib import Path; from clustering_analysis.ingest import ingest_csv;
      ingest_csv(Path('data/raw/creditcard.csv'), source='kaggle://mlg-ulb/creditcardfraud')"
    deps:
      - data/raw/creditcard.csv
      - src/clustering_analysis/ingest.py
      - src/clustering_analysis/schemas.py
    outs:
      - data/raw/creditcard.parquet
      - data/raw/manifest.json

  clean_features:
    cmd: >-
      python -c "
      from pathlib import Path; import pandas as pd;
      from clustering_analysis.config import load_params;
      from clustering_analysis.clean import clean_frame, write_decision_log;
      from clustering_analysis.features import engineer_features;
      from clustering_analysis.io_utils import raw_path, interim_path;
      P = load_params();
      df = pd.read_parquet(raw_path('creditcard.parquet'));
      cleaned, stats = clean_frame(df, drop_duplicates=P.clean.drop_duplicates);
      cleaned.to_parquet(interim_path('cleaned.parquet'), index=False);
      write_decision_log(stats, Path('reports/decision_log.md'));
      feat = engineer_features(cleaned.drop(columns=['Class']), period_seconds=P.features.time_period_seconds);
      feat.to_parquet(interim_path('features.parquet'), index=False);
      pd.Series(cleaned['Class'].values).to_frame('Class').to_parquet(interim_path('labels.parquet'), index=False);
      "
    deps:
      - data/raw/creditcard.parquet
      - src/clustering_analysis/clean.py
      - src/clustering_analysis/features.py
    params:
      - clean
      - features
    outs:
      - data/interim/cleaned.parquet
      - data/interim/features.parquet
      - data/interim/labels.parquet
      - reports/decision_log.md

  scale_reduce_tendency:
    cmd: jupyter nbconvert --to notebook --execute notebooks/phase1_04_tendency_eda.ipynb --inplace
    deps:
      - notebooks/phase1_04_tendency_eda.ipynb
      - data/interim/features.parquet
      - data/interim/labels.parquet
      - src/clustering_analysis/scaling.py
      - src/clustering_analysis/reduce.py
      - src/clustering_analysis/tendency.py
    params:
      - scaling
      - reduce
      - tendency
      - seeds
    outs:
      - data/processed/X_scaled.npy
      - data/processed/X_pca.npy
      - data/processed/umap_2d.npy
      - data/processed/labels.npy
      - data/processed/scaler.joblib
      - reports/figures/pca_explained_variance.pdf
      - reports/figures/umap_density.pdf
      - reports/figures/umap_fraud_overlay.pdf
      - reports/figures/vat_heatmap.pdf

  report:
    cmd: cd reports && make analysis_plan.pdf phase1_report.pdf
    deps:
      - reports/analysis_plan.tex
      - reports/phase1_report.tex
      - reports/figures/pca_explained_variance.pdf
      - reports/figures/umap_density.pdf
      - reports/figures/vat_heatmap.pdf
    outs:
      - reports/analysis_plan.pdf
      - reports/phase1_report.pdf
