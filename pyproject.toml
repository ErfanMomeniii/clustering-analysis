[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clustering-analysis"
version = "0.1.0"
description = "DS-10 Credit Card Fraud clustering analysis — Advanced Data Mining final project (KNTU, Spring 1404-1405)"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scikit-learn-extra>=0.3",
    "hdbscan>=0.8.38",
    "umap-learn>=0.5.6",
    "gower>=0.1.2",
    "kneed>=0.8",
    "yellowbrick>=1.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.13",
    "pyarrow>=16",
    "pandera>=0.20",
    "pyyaml>=6",
    "joblib>=1.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "black>=24",
    "pre-commit>=3.7",
    "jupyter>=1",
    "nbformat>=5.10",
]
pipeline = [
    "dvc[s3]>=3.50",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET"]
ignore = ["E501"]  # black handles line length

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: marks tests as slow"]
