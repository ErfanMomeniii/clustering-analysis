[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clustering-analysis"
version = "0.1.0"
description = "DS-10 Credit Card Fraud clustering analysis — Advanced Data Mining final project (KNTU, Spring 1404-1405)"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
# Only packages the code actually imports. Unused declarations were removed
# because they are a reproducibility liability, not free documentation:
# scikit-learn-extra in particular fails to build against current scikit-learn,
# so declaring it would break `pip install -e .` on a grader's machine for a
# feature this project never used.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "hdbscan>=0.8.38",
    "umap-learn>=0.5.6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.13",
    "pyarrow>=16",
    "pandera>=0.20",
    "pyyaml>=6",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "black>=24",
    "pre-commit>=3.7",
    "jupyter>=1",
    "nbformat>=5.10",
    "jupytext>=1.16",
]
pipeline = [
    "dvc[s3]>=3.50",
]
deep = [
    "torch>=2.9",
    "shap>=0.45",
    "dice_ml>=0.12",
]
app = [
    "streamlit>=1.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET"]
ignore = ["E501"]  # black handles line length

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: marks tests as slow"]

[tool.jupytext]
# Pair every notebook with a percent-format script. Without this the `jupytext
# --sync` pre-commit hook silently does nothing ("not a paired notebook"), which
# is how the executed notebook and its re-runnable script drifted apart before.
formats = "ipynb,py:percent"
